<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ededed;
            --text-muted: #888888;
            --border-color: #222222;
            --accent-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .pricelist {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.95rem;
        }

        .service {
            color: var(--text-color);
        }

        .dots {
            flex-grow: 1;
            border-bottom: 1px dotted var(--border-color);
            margin: 0 12px;
        }

        .price {
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .btn {
            display: inline-block;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            position: relative;
            transition: color 0.2s ease;
        }

        .btn:hover {
            color: var(--text-muted);
        }

        .btn::after {
            content: '→';
            margin-left: 6px;
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .btn:hover::after {
            transform: translateX(4px);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Pricing</h1>
            <p>Simple, transparent rates for design and development work. Available for select projects.</p>
        </header>

        <main class="pricelist">
            <div class="price-item">
                <span class="service">Landing Page</span>
                <span class="dots"></span>
                <span class="price">$1,500</span>
            </div>

            <div class="price-item">
                <span class="service">Web Application</span>
                <span class="dots"></span>
                <span class="price">$4,000+</span>
            </div>

            <div class="price-item">
                <span class="service">Design System</span>
                <span class="dots"></span>
                <span class="price">$2,500</span>
            </div>

            <div class="price-item">
                <span class="service">Consulting & Audit</span>
                <span class="dots"></span>
                <span class="price">$200/hr</span>
            </div>
        </main>

        <footer>
            <a href="Ethicallab@protonmail.com" class="btn">Get in touch</a>
        </footer>
    </div>

</body>
</html>
