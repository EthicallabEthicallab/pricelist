<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Preisliste</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Kopfbereich -->
        <header>
            <h1>Deine Dienstleistung</h1>
            <p>Wähle das passende Angebot für deine Bedürfnisse.</p>
        </header>

        <!-- Preisliste -->
        <main class="pricelist">
            <div class="price-item">
                <span class="service">Basis Paket</span>
                <span class="dots"></span>
                <span class="price">49 €</span>
            </div>

            <div class="price-item">
                <span class="service">Standard Paket</span>
                <span class="dots"></span>
                <span class="price">99 €</span>
            </div>

            <div class="price-item">
                <span class="service">Premium Paket</span>
                <span class="dots"></span>
                <span class="price">199 €</span>
            </div>
        </main>

        <!-- Footer / Kontakt -->
        <footer>
            <a href="mailto:deine@email.com" class="btn">Kontakt aufnehmen</a>
        </footer>
    </div>

</body>
</html>
